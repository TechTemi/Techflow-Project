name: TechFlow CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging

  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  # ============================================================
  # TEST
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run application tests
        run: |
          pytest test_app.py -v

      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@v3.97.0
        with:
          extra_args: --results=verified,unknown --fail

      - name: Send test-stage failure email
        if: failure() && github.event_name == 'push'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: "TechFlow CI/CD FAILED — Test — ${{ github.ref_name }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "TechFlow CI/CD <${{ secrets.EMAIL_USERNAME }}>"
          body: |
            TechFlow CI/CD pipeline failed during the Test stage.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ============================================================
  # BUILD AND PUSH
  # ============================================================
  build_and_push:
    name: Build & Push
    runs-on: ubuntu-latest

    needs:
      - test

    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Select deployment image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REPO="${{ secrets.DOCKERHUB_USERNAME }}/techflow-app"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            CHANNEL_TAG="latest"
          elif [ "${GITHUB_REF_NAME}" = "staging" ]; then
            CHANNEL_TAG="staging"
          else
            echo "Unsupported deployment branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "image_repo=${IMAGE_REPO}" >> "${GITHUB_OUTPUT}"
          echo "channel_tag=${CHANNEL_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REPO="${{ steps.image.outputs.image_repo }}"
          CHANNEL_TAG="${{ steps.image.outputs.channel_tag }}"

          docker build \
            --tag "${IMAGE_REPO}:${CHANNEL_TAG}" \
            --tag "${IMAGE_REPO}:${GITHUB_SHA}" \
            .

      - name: Push channel image tag
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REPO="${{ steps.image.outputs.image_repo }}"
          CHANNEL_TAG="${{ steps.image.outputs.channel_tag }}"

          docker push "${IMAGE_REPO}:${CHANNEL_TAG}"

      - name: Push immutable commit SHA image tag
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REPO="${{ steps.image.outputs.image_repo }}"

          docker push "${IMAGE_REPO}:${GITHUB_SHA}"

      - name: Send build-stage failure email
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: "TechFlow CI/CD FAILED — Build & Push — ${{ github.ref_name }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "TechFlow CI/CD <${{ secrets.EMAIL_USERNAME }}>"
          body: |
            TechFlow CI/CD pipeline failed during the Docker Build & Push stage.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs:
      - build_and_push

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/techflow-app

      DEPLOY_TAG: ${{ github.ref_name == 'main' && 'latest' || 'staging' }}

      STABLE_TAG: ${{ github.ref_name == 'main' && 'previous_stable' || 'previous_stable_staging' }}

      DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      # --------------------------------------------------------
      # Checkout is required because the deployment scripts
      # must be available on the GitHub Actions runner before
      # they can be copied to the EC2 host.
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # --------------------------------------------------------
      # Synchronize deployment scripts to the correct EC2 host.
      #
      # main    -> production EC2
      # staging -> staging EC2
      #
      # strip_components: 1 removes the local "scripts/"
      # directory so that the files become:
      #
      # /home/ubuntu/health_check.sh
      # /home/ubuntu/rollback.sh
      # /home/ubuntu/tag_stable.sh
      # --------------------------------------------------------
      - name: Upload deployment scripts to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ github.ref_name == 'main' && secrets.EC2_HOST || secrets.STAGING_EC2_HOST }}
          username: ubuntu
          key: ${{ github.ref_name == 'main' && secrets.EC2_SSH_KEY || secrets.STAGING_EC2_SSH_KEY }}
          port: 22
          source: "scripts/health_check.sh,scripts/rollback.sh,scripts/tag_stable.sh"
          target: "/home/ubuntu"
          strip_components: 1
          overwrite: true

      # --------------------------------------------------------
      # Deploy application over SSH.
      #
      # The first operation validates that all synchronized
      # deployment scripts exist and makes them executable.
      # --------------------------------------------------------
      - name: Deploy application over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ env.DOCKERHUB_TOKEN }}
          IMAGE_REPO: ${{ env.IMAGE_REPO }}
          DEPLOY_TAG: ${{ env.DEPLOY_TAG }}
          STABLE_TAG: ${{ env.STABLE_TAG }}
          DEPLOY_ENVIRONMENT: ${{ env.DEPLOY_ENVIRONMENT }}
        with:
          host: ${{ github.ref_name == 'main' && secrets.EC2_HOST || secrets.STAGING_EC2_HOST }}
          username: ubuntu
          key: ${{ github.ref_name == 'main' && secrets.EC2_SSH_KEY || secrets.STAGING_EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_REPO,DEPLOY_TAG,STABLE_TAG,DEPLOY_ENVIRONMENT
          script: |
            set -euo pipefail

            CONTAINER_NAME="techflow-app"

            HEALTH_CHECK_SCRIPT="/home/ubuntu/health_check.sh"
            ROLLBACK_SCRIPT="/home/ubuntu/rollback.sh"
            TAG_STABLE_SCRIPT="/home/ubuntu/tag_stable.sh"

            echo "=========================================="
            echo "TechFlow deployment"
            echo "Environment: ${DEPLOY_ENVIRONMENT}"
            echo "Image: ${IMAGE_REPO}:${DEPLOY_TAG}"
            echo "Stable tag: ${STABLE_TAG}"
            echo "=========================================="

            # --------------------------------------------------
            # Validate synchronized deployment scripts
            # --------------------------------------------------
            echo "Validating deployment scripts..."

            REQUIRED_SCRIPTS=(
              "${HEALTH_CHECK_SCRIPT}"
              "${ROLLBACK_SCRIPT}"
              "${TAG_STABLE_SCRIPT}"
            )

            for SCRIPT in "${REQUIRED_SCRIPTS[@]}"; do
              if [ ! -f "${SCRIPT}" ]; then
                echo "ERROR: required deployment script is missing: ${SCRIPT}"
                exit 1
              fi
            done

            echo "PASS: all required deployment scripts are present."

            # --------------------------------------------------
            # Ensure scripts are executable
            # --------------------------------------------------
            echo "Setting deployment script permissions..."

            chmod 750 \
              "${HEALTH_CHECK_SCRIPT}" \
              "${ROLLBACK_SCRIPT}" \
              "${TAG_STABLE_SCRIPT}"

            echo "PASS: deployment scripts are executable."

            # --------------------------------------------------
            # DockerHub authentication
            # --------------------------------------------------
            echo "Authenticating EC2 host with DockerHub..."

            echo "${DOCKERHUB_TOKEN}" |
              docker login \
                --username "${DOCKERHUB_USERNAME}" \
                --password-stdin

            # --------------------------------------------------
            # Preserve currently running image for rollback
            # --------------------------------------------------
            echo "Preserving the currently running image..."

            "${TAG_STABLE_SCRIPT}" \
              "${IMAGE_REPO}" \
              "${CONTAINER_NAME}" \
              "${STABLE_TAG}"

            # --------------------------------------------------
            # Pull new image
            # --------------------------------------------------
            echo "Pulling new deployment image..."

            docker pull "${IMAGE_REPO}:${DEPLOY_TAG}"

            # --------------------------------------------------
            # Replace application container
            # --------------------------------------------------
            echo "Removing previous application container..."

            docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

            echo "Starting new application container..."

            docker run \
              --detach \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              --publish 80:5000 \
              "${IMAGE_REPO}:${DEPLOY_TAG}"

            # --------------------------------------------------
            # Post-deployment health validation
            # --------------------------------------------------
            echo "Running post-deployment health check..."

            if "${HEALTH_CHECK_SCRIPT}" "http://localhost/health"; then
              echo "PASS: ${DEPLOY_ENVIRONMENT} deployment is healthy."

              echo "Currently running container:"
              docker ps \
                --filter "name=^/${CONTAINER_NAME}$"

              exit 0
            fi

            # --------------------------------------------------
            # Deployment failed
            # --------------------------------------------------
            echo "FAIL: new deployment is unhealthy."

            echo "Capturing failed container logs..."

            docker logs "${CONTAINER_NAME}" || true

            # --------------------------------------------------
            # Automated rollback
            # --------------------------------------------------
            echo "Starting rollback..."

            if "${ROLLBACK_SCRIPT}" \
              "${IMAGE_REPO}" \
              "${CONTAINER_NAME}" \
              "80" \
              "5000" \
              "${STABLE_TAG}"; then

              echo "PASS: rollback restored the previous stable application."
              echo "The deployment itself is still being marked FAILED."

              exit 1
            fi

            echo "CRITICAL: deployment failed and rollback also failed."

            exit 1

      # --------------------------------------------------------
      # Deployment success notification
      # --------------------------------------------------------
      - name: Send deployment success email
        if: success()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: "TechFlow CI/CD SUCCESS — ${{ github.ref_name }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "TechFlow CI/CD <${{ secrets.EMAIL_USERNAME }}>"
          body: |
            TechFlow deployment completed successfully.

            Repository: ${{ github.repository }}
            Environment: ${{ env.DEPLOY_ENVIRONMENT }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Image: ${{ env.IMAGE_REPO }}:${{ env.DEPLOY_TAG }}
            Actor: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # --------------------------------------------------------
      # Deployment failure notification
      # --------------------------------------------------------
      - name: Send deployment failure email
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: "TechFlow CI/CD FAILED — Deploy — ${{ github.ref_name }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "TechFlow CI/CD <${{ secrets.EMAIL_USERNAME }}>"
          body: |
            TechFlow deployment failed.

            The automated rollback procedure was invoked when the
            post-deployment health check failed.

            Repository: ${{ github.repository }}
            Environment: ${{ env.DEPLOY_ENVIRONMENT }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}